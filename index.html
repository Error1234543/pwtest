<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Mode ⚡</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at 20% 20%, #0f172a, #020617 60%, #000000);
    overflow:hidden;
    color:#e6f1ff;
}

/* subtle moving gradient overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background: radial-gradient(circle at 80% 30%, rgba(0,234,255,0.12), transparent 40%),
                radial-gradient(circle at 10% 80%, rgba(0,120,255,0.12), transparent 40%);
    animation: floatBG 12s ease-in-out infinite alternate;
}

@keyframes floatBG{
    from{transform:translateY(-10px)}
    to{transform:translateY(10px)}
}

/* lightning flash */
.flash{
    position:fixed;
    width:100%;
    height:100%;
    background:white;
    opacity:0;
    animation:flash 7s infinite;
}

@keyframes flash{
    0%,96%,100%{opacity:0}
    97%{opacity:0.85}
    98%{opacity:0}
    99%{opacity:0.5}
}

.container{
    position:relative;
    text-align:center;
    padding:50px 40px;
    border-radius:24px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(18px);
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
    z-index:2;
}

h1{
    font-size:34px;
    margin-bottom:18px;
    color:#00eaff;
    text-shadow:0 0 18px #00eaff;
}

p{
    font-size:17px;
    margin:6px 0;
    opacity:0.9;
}

/* ===== DANGER SPINNER ===== */
.danger-ring{
    position:relative;
    width:120px;
    height:120px;
    margin:25px auto;
}

.danger-ring::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:3px dashed rgba(255,0,0,0.6);
    animation: spin 6s linear infinite;
}

.danger-ring::after{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:50%;
    border:3px solid rgba(0,234,255,0.6);
    animation: spinReverse 4s linear infinite;
}

.danger-icon{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:40px;
    color:#ff3b3b;
    text-shadow:0 0 15px red;
    animation:pulse 1.5s infinite;
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes spinReverse{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
}

@keyframes pulse{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.2)}
}

.footer{
    margin-top:15px;
    font-size:14px;
    opacity:0.7;
}

</style></head><body><div class="flash"></div><div class="container"><h3>🏖️ Maintenance Mode 🏖️</h3><p>⚠️ This app or website is currently turned OFF.</p>
<p>⏳ It may be turned ON again after some time.</p><div class="danger-ring">
    <div class="danger-icon">⚠️</div>
</div><div class="footer">🙏 Please wait... 💙</div></div></body>
</html>
